name: GTA 6 Daily Leonida & Kalshi Market Pulse

on:
  schedule:
    # Runs every day at 14:00 UTC = 9:00 AM EST (US / Kalshi Market Open) / 7:30 PM IST
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      desk_note:
        description: "Optional custom analyst note to include in today's pulse report"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  daily-leonida-pulse:
    name: Run GTA 6 Live Market & Telemetry Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analytics dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install --quiet pandas matplotlib openpyxl

      - name: Execute GTA 6 Daily Checks & Generate Report
        env:
          DESK_NOTE: ${{ inputs.desk_note }}
        run: |
          python src/gta6_daily_check.py

      - name: Publish Daily Pulse to GitHub Actions Step Summary
        run: |
          cat "GTA 6 PREDICTION/daily_reports/LATEST_DAILY_PULSE.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit & Push Updated Daily Telemetry & Reports
        run: |
          git config user.name "kalshi-gta6-research-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "GTA 6 PREDICTION/daily_reports/" "GTA 6 PREDICTION/charts/" "GTA 6 PREDICTION/README.md" "docs/live_pulse.json"
          if git diff --staged --quiet; then
            echo "No telemetry changes since last snapshot."
          else
            REPORT_DATE=$(date -u +"%Y-%m-%d")
            git commit -m "chore(gta6-daily): automated 09:00 EST Leonida & Kalshi market pulse [${REPORT_DATE}]"
            git pull --rebase origin main
            git push origin main
          fi
